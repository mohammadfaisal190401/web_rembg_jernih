<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hapus Background - Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f5f7fa; display: flex; justify-content: center; padding: 0; margin: 0; }
        .app { width: 100%; max-width: 480px; background: white; min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.05); padding: 16px 12px 30px; }

        h1 { font-size: 22px; font-weight: 700; color: #1a73e8; text-align: center; margin: 8px 0 12px; }
        .info { background: #e8f0fe; padding: 8px 12px; border-radius: 10px; font-size: 12px; color: #1a5bb5; text-align: center; margin-bottom: 14px; }

        .upload-box { border: 2px dashed #ccc; border-radius: 14px; padding: 16px 12px; text-align: center; background: #fafafa; margin-bottom: 14px; }
        .upload-box label { display: inline-block; padding: 10px 20px; background: #1a73e8; color: white; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; }
        .upload-box label:hover { background: #1557b0; }
        #fileInput { display: none; }
        #fileCount { margin-top: 8px; font-size: 13px; color: #333; font-weight: 500; }
        .btn-proses { width: 100%; padding: 12px; background: #34a853; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .btn-proses:disabled { background: #ccc; cursor: not-allowed; }
        .btn-proses:active { transform: scale(0.97); }
        .btn-cancel { width: 100%; padding: 12px; background: #d93025; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; display: none; }
        .btn-cancel:active { transform: scale(0.97); }

        .preview-container { margin: 10px 0; max-height: 220px; overflow-y: auto; display: none; }
        .preview-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .preview-item { aspect-ratio: 1 / 1; background: #f0f2f5; border-radius: 6px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .preview-item img { width: 100%; height: 100%; object-fit: cover; }

        .progress-container { display: none; margin: 10px 0; background: #f0f2f5; border-radius: 10px; padding: 12px; }
        .progress-bar-bg { width: 100%; height: 8px; background: #ddd; border-radius: 4px; overflow: hidden; margin: 6px 0; }
        .progress-bar-fill { height: 100%; width: 0%; background: #1a73e8; border-radius: 4px; transition: width 0.3s; }
        .progress-text { font-size: 14px; font-weight: 600; color: #333; text-align: center; }
        .file-status-list { margin-top: 8px; max-height: 120px; overflow-y: auto; font-size: 12px; }
        .file-status-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #eee; }
        .file-status-item .status { font-weight: 600; }
        .status-done { color: #34a853; }
        .status-error { color: #d93025; }
        .status-processing { color: #f9ab00; }
        .status-waiting { color: #999; }

        .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; background: #f0f2f5; padding: 8px 12px; border-radius: 12px; margin-bottom: 14px; gap: 6px; }
        .toggle-group { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
        .toggle-group input[type="checkbox"] { width: 18px; height: 18px; accent-color: #1a73e8; cursor: pointer; }
        .sort-group { display: flex; gap: 4px; }
        .sort-group button { background: white; border: 1px solid #ccc; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
        .sort-group button.active { background: #1a73e8; color: white; border-color: #1a73e8; }
        .delete-all { background: #d93025; color: white; border: none; border-radius: 6px; padding: 4px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }

        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .card { background: white; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid #eaeef3; overflow: hidden; position: relative; }
        .card .image-wrapper { position: relative; background: #f0f2f5; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .card .image-wrapper img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .card .expand-btn { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 50%; width: 28px; height: 28px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
        .card .expand-btn:active { transform: scale(0.9); }
        .card .card-footer { padding: 6px 8px; display: flex; justify-content: space-between; align-items: center; font-size: 10px; }
        .card .filename { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80px; color: #555; }
        .card .actions { display: flex; gap: 4px; }
        .card .actions a, .card .actions button { background: transparent; border: none; padding: 2px 6px; font-size: 14px; cursor: pointer; text-decoration: none; color: #1a73e8; }
        .card .actions a.download { color: #1a73e8; }
        .card .actions button.delete { color: #d93025; }

        .group-label { font-size: 13px; font-weight: 600; color: #333; background: #e8ecf1; padding: 6px 10px; border-radius: 8px; margin: 16px 0 8px; }

        .empty-state { text-align: center; color: #777; padding: 40px 0; font-size: 14px; }

        .lightbox { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; padding: 20px; }
        .lightbox.active { display: flex; }
        .lightbox .close { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.2); border: none; color: white; font-size: 30px; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .lightbox .close:active { transform: scale(0.9); }
        .lightbox .image-container { width: 100%; max-width: 100%; height: auto; max-height: 80vh; display: flex; align-items: center; justify-content: center; }
        .lightbox .image-container img { max-width: 100%; max-height: 80vh; width: auto; height: auto; object-fit: contain; }
        .lightbox .lightbox-footer { display: flex; gap: 20px; margin-top: 20px; }
        .lightbox .lightbox-footer a, .lightbox .lightbox-footer button { background: rgba(255,255,255,0.15); color: white; border: none; padding: 10px 24px; border-radius: 30px; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none; backdrop-filter: blur(4px); }
        .lightbox .lightbox-footer a.download { background: #1a73e8; color: white; }
        .lightbox .lightbox-footer button.delete { background: #d93025; color: white; }
        .lightbox .lightbox-footer button:active { transform: scale(0.95); }

        @media screen and (min-width: 481px) {
            .app { max-width: 480px; margin: 0 auto; }
        }
    </style>
</head>
<body>
<div class="app">
    <h1>🧹 Hapus Background</h1>
    <div class="info">📱 Upload foto, hasil jernih & siap edit lanjutan</div>

    <div class="upload-box">
        <label for="fileInput">📁 Pilih Gambar</label>
        <input type="file" id="fileInput" multiple accept="image/*">
        <div id="fileCount" style="margin-top:6px; font-weight:500;"></div>
        <div class="preview-container" id="previewContainer">
            <div class="preview-grid" id="previewGrid"></div>
        </div>
        <button class="btn-proses" id="btnProses" disabled>🚀 Hapus Background</button>
        <button class="btn-cancel" id="btnCancel">⛔ Batal</button>
    </div>

    <!-- Progress Area -->
    <div class="progress-container" id="progressContainer">
        <div class="progress-text" id="progressText">0 / 0 photo</div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <div class="file-status-list" id="fileStatusList"></div>
    </div>

    <div class="controls">
        <div class="toggle-group">
            <input type="checkbox" id="toggleOriginal">
            <label for="toggleOriginal" style="font-size:12px;">Asli</label>
        </div>
        <div class="sort-group">
            <button id="sortDesc" class="active" data-order="desc">⬇️</button>
            <button id="sortAsc" data-order="asc">⬆️</button>
        </div>
        <div class="toggle-group">
            <input type="checkbox" id="toggleAutoDownload" checked>
            <label for="toggleAutoDownload" style="font-size:12px;">⏬ Otomatis</label>
        </div>
        <button class="delete-all" id="deleteAllBtn">🗑️ Semua</button>
    </div>

    <div id="historyContainer">
        <div class="empty-state">📭 Belum ada gambar diproses</div>
    </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
    <button class="close" id="lightboxClose">✕</button>
    <div class="image-container">
        <img id="lightboxImage" src="" alt="Preview">
    </div>
    <div class="lightbox-footer">
        <a href="#" id="lightboxDownload" class="download">⬇️ Unduh</a>
        <button id="lightboxDelete" class="delete">🗑️ Hapus</button>
    </div>
</div>

<script>
    // ---------- GLOBAL ----------
    let historyData = [];
    let showOriginal = false;
    let sortOrder = 'desc';
    let currentLightboxId = null;
    let autoDownload = true;
    let processing = false;
    let sessionId = null;
    let eventSource = null;

    // ---------- ELEMEN ----------
    const fileInput = document.getElementById('fileInput');
    const fileCount = document.getElementById('fileCount');
    const btnProses = document.getElementById('btnProses');
    const btnCancel = document.getElementById('btnCancel');
    const previewContainer = document.getElementById('previewContainer');
    const previewGrid = document.getElementById('previewGrid');
    const progressContainer = document.getElementById('progressContainer');
    const progressText = document.getElementById('progressText');
    const progressFill = document.getElementById('progressFill');
    const fileStatusList = document.getElementById('fileStatusList');
    const toggleOriginal = document.getElementById('toggleOriginal');
    const toggleAutoDownload = document.getElementById('toggleAutoDownload');
    const sortDesc = document.getElementById('sortDesc');
    const sortAsc = document.getElementById('sortAsc');
    const deleteAllBtn = document.getElementById('deleteAllBtn');
    const historyContainer = document.getElementById('historyContainer');
    const lightbox = document.getElementById('lightbox');
    const lightboxImage = document.getElementById('lightboxImage');
    const lightboxDownload = document.getElementById('lightboxDownload');
    const lightboxDelete = document.getElementById('lightboxDelete');
    const lightboxClose = document.getElementById('lightboxClose');

    // ---------- FORMAT TANGGAL ----------
    function formatDate(timestamp) {
        try {
            const dt = new Date(timestamp);
            if (isNaN(dt.getTime())) return 'Tanggal error';
            const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
            const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
            const dayName = days[dt.getDay()];
            const day = String(dt.getDate()).padStart(2,'0');
            const month = months[dt.getMonth()];
            const year = dt.getFullYear();
            const now = new Date();
            if (dt.getFullYear() === now.getFullYear()) {
                return `${dayName}. ${day}/${month}`;
            } else {
                return `${dayName}. ${day}/${month}/${year}`;
            }
        } catch(e) { return 'Tanggal error'; }
    }

    // ---------- LOAD HISTORY ----------
    async function loadHistory() {
        try {
            const resp = await fetch('/api/history');
            const data = await resp.json();
            historyData = data;
            renderHistory();
        } catch(e) {
            console.error('Gagal load history:', e);
            historyContainer.innerHTML = `<div class="empty-state">⚠️ Gagal memuat history</div>`;
        }
    }

    // ---------- RENDER HISTORY ----------
    function renderHistory() {
        if (!historyData || historyData.length === 0) {
            historyContainer.innerHTML = `<div class="empty-state">📭 Belum ada gambar diproses</div>`;
            return;
        }

        const sorted = [...historyData];
        if (sortOrder === 'desc') {
            sorted.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
        } else {
            sorted.sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));
        }

        const groups = {};
        sorted.forEach(entry => {
            const dateKey = new Date(entry.timestamp).toDateString();
            const dateStr = formatDate(entry.timestamp);
            if (!groups[dateKey]) {
                groups[dateKey] = { label: dateStr, entries: [] };
            }
            groups[dateKey].entries.push(entry);
        });

        let html = '';
        for (const key of Object.keys(groups)) {
            const group = groups[key];
            html += `<div class="group-label">${group.label}</div>`;
            html += `<div class="grid">`;
            group.entries.forEach(entry => {
                const imgSrc = showOriginal ? `/image/${entry.id}/original` : `/image/${entry.id}/result`;
                html += `
                    <div class="card" data-id="${entry.id}">
                        <div class="image-wrapper">
                            <img src="${imgSrc}" alt="${entry.original_filename}" loading="lazy">
                            <button class="expand-btn" data-id="${entry.id}">🔍</button>
                        </div>
                        <div class="card-footer">
                            <span class="filename" title="${entry.original_filename}">${entry.original_filename}</span>
                            <div class="actions">
                                <a href="/download/${entry.id}" class="download" download>⬇️</a>
                                <button class="delete" data-id="${entry.id}">🗑️</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
        }
        historyContainer.innerHTML = html;

        // Event listener
        document.querySelectorAll('.expand-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const id = this.dataset.id;
                openLightbox(id);
            });
        });
        document.querySelectorAll('.card .delete').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const id = this.dataset.id;
                if (confirm('Hapus gambar ini?')) {
                    deleteEntry(id);
                }
            });
        });
    }

    // ---------- LIGHTBOX ----------
    function openLightbox(entryId) {
        const entry = historyData.find(e => e.id === entryId);
        if (!entry) return;
        currentLightboxId = entryId;
        const imgSrc = showOriginal ? `/image/${entryId}/original` : `/image/${entryId}/result`;
        lightboxImage.src = imgSrc;
        lightboxDownload.href = `/download/${entryId}`;
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
        currentLightboxId = null;
    }

    lightboxClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', function(e) {
        if (e.target === this) closeLightbox();
    });
    lightboxDelete.addEventListener('click', async function() {
        if (!currentLightboxId) return;
        if (!confirm('Hapus gambar ini?')) return;
        await deleteEntry(currentLightboxId);
        closeLightbox();
    });

    // ---------- PREVIEW ----------
    fileInput.addEventListener('change', function(e) {
        const files = this.files;
        const count = files.length;
        if (count > 0) {
            fileCount.textContent = `${count} file dipilih`;
            btnProses.disabled = false;
            previewContainer.style.display = 'block';
            previewGrid.innerHTML = '';
            for (let i=0; i<Math.min(count, 15); i++) {
                const file = files[i];
                const reader = new FileReader();
                const item = document.createElement('div');
                item.className = 'preview-item';
                const img = document.createElement('img');
                reader.onload = function(e) {
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
                item.appendChild(img);
                previewGrid.appendChild(item);
            }
        } else {
            fileCount.textContent = '';
            btnProses.disabled = true;
            previewContainer.style.display = 'none';
            previewGrid.innerHTML = '';
        }
    });

    // ---------- UPLOAD & PROSES ----------
    btnProses.addEventListener('click', async function() {
        if (processing) return;
        const files = fileInput.files;
        if (!files.length) return;

        const formData = new FormData();
        for (let i=0; i<files.length; i++) {
            formData.append('files', files[i]);
        }

        processing = true;
        this.disabled = true;
        this.textContent = '⏳ Upload...';
        btnCancel.style.display = 'block';
        progressContainer.style.display = 'block';
        progressText.textContent = 'Mengupload...';
        progressFill.style.width = '0%';
        fileStatusList.innerHTML = '';

        try {
            const res = await fetch('/upload', {
                method: 'POST',
                body: formData
            });
            const result = await res.json();
            if (!result.session_id) {
                alert('Error: ' + (result.error || 'Gagal upload'));
                resetUpload();
                return;
            }

            sessionId = result.session_id;
            const total = result.total;
            this.textContent = `⏳ Memproses 0/${total}...`;
            progressText.textContent = `0 / ${total} photo`;

            // EventSource
            eventSource = new EventSource(`/progress/${sessionId}`);
            eventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);
                if (data.type === 'ping') return;

                if (data.type === 'file_done') {
                    const percent = data.percent;
                    progressFill.style.width = percent + '%';
                    progressText.textContent = `${data.index} / ${data.total} photo (${percent}%)`;
                    btnProses.textContent = `⏳ Memproses ${data.index}/${data.total}...`;

                    const statusItem = document.createElement('div');
                    statusItem.className = 'file-status-item';
                    statusItem.innerHTML = `
                        <span>${data.filename}</span>
                        <span class="status status-done">✅ Selesai</span>
                    `;
                    fileStatusList.appendChild(statusItem);
                    fileStatusList.scrollTop = fileStatusList.scrollHeight;

                    if (autoDownload) {
                        const link = document.createElement('a');
                        link.href = data.download_url;
                        link.download = '';
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    }

                    loadHistory();

                } else if (data.type === 'error') {
                    const statusItem = document.createElement('div');
                    statusItem.className = 'file-status-item';
                    statusItem.innerHTML = `
                        <span>${data.filename}</span>
                        <span class="status status-error">❌ Gagal</span>
                    `;
                    fileStatusList.appendChild(statusItem);
                    fileStatusList.scrollTop = fileStatusList.scrollHeight;

                } else if (data.type === 'cancelled') {
                    eventSource.close();
                    eventSource = null;
                    processing = false;
                    btnProses.textContent = '⛔ Dibatalkan';
                    progressText.textContent = '⛔ Dibatalkan oleh user';
                    btnCancel.style.display = 'none';
                    setTimeout(() => {
                        resetUpload();
                        // Sembunyikan progress setelah 2 detik
                        progressContainer.style.display = 'none';
                    }, 2000);

                } else if (data.type === 'complete') {
                    eventSource.close();
                    eventSource = null;
                    processing = false;
                    progressText.textContent = '✅ Selesai!';
                    btnProses.textContent = '✅ Selesai';
                    btnCancel.style.display = 'none';
                    setTimeout(() => {
                        resetUpload();
                        progressContainer.style.display = 'none';
                    }, 3000);
                }
            };

            eventSource.onerror = function(e) {
                console.error('SSE error', e);
                if (eventSource) {
                    eventSource.close();
                    eventSource = null;
                }
                processing = false;
                resetUpload();
                alert('Terjadi kesalahan koneksi. Coba lagi.');
            };

            // Reset input & preview
            fileInput.value = '';
            fileCount.textContent = '';
            previewContainer.style.display = 'none';
            previewGrid.innerHTML = '';

        } catch(e) {
            alert('Error: ' + e.message);
            resetUpload();
        }
    });

    // ---------- BATAL ----------
    btnCancel.addEventListener('click', async function() {
        if (!sessionId) return;
        if (!confirm('Batalkan proses editing?')) return;
        try {
            const res = await fetch(`/cancel/${sessionId}`, { method: 'POST' });
            if (res.ok) {
                // Tutup event source
                if (eventSource) {
                    eventSource.close();
                    eventSource = null;
                }
                // Reset UI ke keadaan awal seperti sebelum proses
                processing = false;
                btnProses.disabled = false;
                btnProses.textContent = '🚀 Hapus Background';
                btnCancel.style.display = 'none';
                progressContainer.style.display = 'none';
                progressFill.style.width = '0%';
                fileStatusList.innerHTML = '';
                // Kembalikan preview dan input (biarkan user pilih ulang)
                fileInput.value = '';
                fileCount.textContent = '';
                previewContainer.style.display = 'none';
                previewGrid.innerHTML = '';
                // Refresh history untuk menghilangkan kemungkinan entry yang setengah jadi
                await loadHistory();
            } else {
                alert('Gagal membatalkan');
            }
        } catch(e) {
            alert('Error: ' + e.message);
        }
    });

    function resetUpload() {
        processing = false;
        btnProses.disabled = false;
        btnProses.textContent = '🚀 Hapus Background';
        btnCancel.style.display = 'none';
    }

    // ---------- DELETE ----------
    async function deleteEntry(id) {
        try {
            const res = await fetch(`/delete/${id}`, { method: 'DELETE' });
            if (res.ok) {
                await loadHistory();
            } else {
                alert('Gagal menghapus');
            }
        } catch(e) {
            alert('Error: ' + e.message);
        }
    }

    deleteAllBtn.addEventListener('click', async function() {
        if (!historyData.length) return;
        if (!confirm('Hapus SEMUA gambar dari history?')) return;
        try {
            const res = await fetch('/delete_all', { method: 'DELETE' });
            if (res.ok) {
                await loadHistory();
            } else {
                alert('Gagal hapus semua');
            }
        } catch(e) {
            alert('Error: ' + e.message);
        }
    });

    // ---------- TOGGLE ----------
    toggleOriginal.addEventListener('change', function() {
        showOriginal = this.checked;
        localStorage.setItem('showOriginal', showOriginal);
        renderHistory();
    });
    toggleAutoDownload.addEventListener('change', function() {
        autoDownload = this.checked;
        localStorage.setItem('autoDownload', autoDownload);
    });

    sortDesc.addEventListener('click', function() {
        sortOrder = 'desc';
        sortDesc.classList.add('active');
        sortAsc.classList.remove('active');
        localStorage.setItem('sortOrder', 'desc');
        renderHistory();
    });
    sortAsc.addEventListener('click', function() {
        sortOrder = 'asc';
        sortAsc.classList.add('active');
        sortDesc.classList.remove('active');
        localStorage.setItem('sortOrder', 'asc');
        renderHistory();
    });

    // ---------- PREFERENSI ----------
    function loadPreferences() {
        const savedToggle = localStorage.getItem('showOriginal');
        if (savedToggle === 'true') {
            toggleOriginal.checked = true;
            showOriginal = true;
        }
        const savedSort = localStorage.getItem('sortOrder');
        if (savedSort === 'asc') {
            sortOrder = 'asc';
            sortAsc.classList.add('active');
            sortDesc.classList.remove('active');
        } else {
            sortOrder = 'desc';
            sortDesc.classList.add('active');
            sortAsc.classList.remove('active');
        }
        const savedAuto = localStorage.getItem('autoDownload');
        if (savedAuto === 'false') {
            toggleAutoDownload.checked = false;
            autoDownload = false;
        } else {
            toggleAutoDownload.checked = true;
            autoDownload = true;
        }
    }

    // ---------- INIT ----------
    async function init() {
        loadPreferences();
        await loadHistory();
        setInterval(loadHistory, 10000);
    }
    init();
</script>
